<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rethish Sukumar - CTO</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="app-wrapper">
    <header class="site-header">
      <div class="logo">NEXAFO TECH</div>
      <nav></nav>
    </header>

    <main>
      <section class="hero-section">
        <div class="hero-bg">
          <img id="hero-img" src="./hero-profile-v1.png" alt="Hero Image" />
        </div>
        <div class="hero-content">
          <h1 class="hero-title" id="hero-name"></h1>
          <p class="hero-subtitle" id="hero-role"></p>
          <p class="hero-quote" id="hero-quote"></p>
        </div>
      </section>

      <section class="profile-content container">
        <div class="content-grid">
          <div class="bio-section">
            <h2 id="bio-title">About</h2>
            <p class="bio-text" id="bio-text"></p>
          </div>
          
          <aside>
            <div class="details-card surface">
              <h3>Contact & Details</h3>
              <div class="detail-item">
                <span class="detail-label">Department</span>
                <span class="detail-value" id="detail-dept"></span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Email</span>
                <span class="detail-value">
                  <a id="detail-email" href="#"></a>
                </span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Phone</span>
                <span class="detail-value">
                  <a id="detail-phone" href="#"></a>
                </span>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer container">
      <div class="social-links" id="social-links">
        <!-- Social links injected here via JS -->
      </div>
      <p class="bio-text" style="font-size: 0.8rem;">© 2026 NEXAFO TECH. All rights reserved. Coimbatore, Tamil Nadu.</p>
    </footer>
  </div>
  
  <script src="script.js?v=3"></script>
</body>
</html>
